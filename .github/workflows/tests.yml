name: Antenne Radio Tests

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run antenne_radio tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: antenne_radio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: antenne_radio/requirements.txt

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
