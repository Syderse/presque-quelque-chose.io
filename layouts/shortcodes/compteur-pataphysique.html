{{/* Shortcode: Compteur de Clics 'Pataphysique - Version Infini
  Usage: {{< compteur-pataphysique >}}
*/}}

<div class="click-counter-wrapper my-12 p-8 border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-2xl bg-gray-50 dark:bg-slate-900/50 text-center shadow-sm transition-all hover:shadow-lg hover:border-primary-400 group-hover:rotate-1">
  
  <button id="btn-pataphysique" 
          class="group relative inline-flex items-center justify-center px-8 py-4 text-lg font-bold text-white transition-all duration-300 bg-gradient-to-br from-slate-700 to-black dark:from-slate-800 dark:to-black rounded-lg shadow-lg hover:shadow-primary-500/30 hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 active:scale-95 overflow-hidden">
    
    <span class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-gray-700"></span>
    
    <span class="relative flex items-center gap-3">
      <span class="text-2xl transition-transform duration-500 group-hover:rotate-[360deg]">🌀</span>
      <span>perturber l'univers</span>
    </span>
  </button>

  <div class="mt-6 font-mono text-sm uppercase tracking-widest text-gray-500 dark:text-gray-500">
    Niveau d'entropie : 
    <span id="compteur-affichage" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-primary-600 to-secondary-500 ml-2 font-sans">0</span>
  </div>

  <div class="h-12 mt-4 flex items-center justify-center">
    <p id="message-feedback" class="text-sm font-medium text-gray-600 dark:text-gray-300 italic transition-all duration-500 opacity-0 transform translate-y-2"></p>
  </div>

</div>

<script>
(function() {
  const STORAGE_KEY = 'pqc_compteur_clics';
  const btn = document.getElementById('btn-pataphysique');
  const display = document.getElementById('compteur-affichage');
  const feedback = document.getElementById('message-feedback');

  if (!btn || !display) return;

  // 1. Initialisation
  let count = parseInt(localStorage.getItem(STORAGE_KEY) || '0');
  display.innerText = count;

  // 2. La Grande Liste de l'Infini
  const baseMessages = [
    // Pseudo-Science & Absurde
    "Calibrage des gidouilles...",
    "L'inutilité progresse de 0.001%.",
    "Rotation axiale confirmée.",
    "Ceci n'est pas un clic, c'est une conviction.",
    "Le vide se remplit de vide.",
    "Analyse spectrale du curseur...",
    "Veuillez ne pas insister (ou si).",
    "Chargement de la procrastination...",
    "Un chat de Schrödinger vient de mourir.",
    "Ou de revivre. On ne sait pas.",
    "Calcul de l'âge du capitaine...",
    
    // Références à la Fourmi (Curseur)
    "La fourmi a senti cette secousse.",
    "Attention, vous allez écraser des pixels.",
    "Encore une miette de donnée.",
    "La colonie approuve ce geste.",
    
    // Méta & Humour Web
    "Erreur 404 : Motivation non trouvée.",
    "Ce clic a été envoyé à la NSA.",
    "Sauvegarde dans le Cloud (imaginaire).",
    "Votre souris commence à fatiguer.",
    "Pixel #43029 défectueux, tant pis.",
    "J'espère que vous êtes payé pour ça.",
    "Avez-vous essayé de l'éteindre et rallumer ?",
    
    // Compliments étranges
    "Quelle dextérité remarquable.",
    "Un index tout à fait supérieur.",
    "L'élégance de ce clic m'émeut.",
    "Vous cliquez comme un poète.",
    
    // Passif-agressif doux
    "Encore ?",
    "C'est fascinant, continuez...",
    "Vous n'avez rien de mieux à faire ?",
    "Je note ça dans mon registre invisible.",
    "C'est bon, j'ai compris.",
    "On arrive bientôt à l'infini."
  ];

  // Système de "Sac" pour éviter les répétitions
  let availableMessages = [];

  function getNextMessage() {
    if (availableMessages.length === 0) {
      // On remplit le sac et on mélange
      availableMessages = [...baseMessages];
      // Algorithme de mélange de Fisher-Yates
      for (let i = availableMessages.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [availableMessages[i], availableMessages[j]] = [availableMessages[j], availableMessages[i]];
      }
    }
    return availableMessages.pop();
  }

  // Gestionnaire de clic
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    
    // Logique visuelle (petit rebond)
    btn.classList.add('scale-95');
    setTimeout(() => btn.classList.remove('scale-95'), 100);
    
    // Compteur
    count++;
    display.innerText = count;
    localStorage.setItem(STORAGE_KEY, count);

    // Affichage du message (Systématique ou aléatoire ?)
    // Ici : on affiche un message à chaque clic pour le fun, 
    // ou tous les X clics pour ne pas saturer. Disons : à chaque clic.
    
    const msg = getNextMessage();
    feedback.style.opacity = '0';
    feedback.style.transform = 'translateY(10px)';
    
    setTimeout(() => {
      feedback.innerText = msg;
      feedback.style.opacity = '1';
      feedback.style.transform = 'translateY(0)';
    }, 150); // Petit délai pour l'animation
  });

})();
</script>
