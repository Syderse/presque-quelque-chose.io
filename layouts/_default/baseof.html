<!doctype html>
<html lang="{{ .Site.Language.Lang | default "fr" }}">

<head>
  {{- partial "seo.html" . -}}
  {{- partial "css.html" . -}}
</head>

<body>

  {{- partial "header.html" . -}}

  <main class="{{ if .Params.full_width }}wide{{ else }}measure{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>

  {{- partial "footer.html" . -}}

  {{/* Lien « article au hasard » — minuscule, inline. */}}
  <script>
    async function randomArticle(fallback = '/solutions-imaginaires/') {
      try {
        const r = await fetch('/articles-aleatoires.json');
        if (r.ok) {
          const data = await r.json();
          if (data.length > 0) {
            window.location.href = data[Math.floor(Math.random() * data.length)].permalink;
            return;
          }
        }
      } catch (e) { console.error("Randomizer Error:", e); }
      if (fallback) window.location.href = fallback;
    }
  </script>

  {{ block "scripts" . }}{{ end }}

</body>
</html>
