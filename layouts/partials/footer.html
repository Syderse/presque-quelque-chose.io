{{/* FOOTER:
    bg-ctp-mantle : Fond plus sombre (#181825) pour "fermer" la page
    border-ctp-surface0 : Bordure discrète
*/}}
<footer class="mt-auto w-full border-t border-ctp-surface0 bg-ctp-mantle py-12">
  <div class="mx-auto max-w-screen-xl px-4 text-center">
    
    {{/* Text : Subtext1 pour réduire l'importance visuelle par rapport au contenu */}}
    <p class="font-mono text-sm text-ctp-subtext1">
      &copy; {{ now.Year }} {{ .Site.Title }}
    </p>
    
  </div>
</footer>
