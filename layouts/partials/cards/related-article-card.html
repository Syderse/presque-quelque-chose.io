{{/* Lien d'article lié — version texte type-heavy (P11)
     Usage : dans une <ul class="related-list">, {{ partial "cards/related-article-card.html" . }}
     Contexte : un objet Page. */}}
<li class="related-item">
  <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  <time class="related-date kicker" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
</li>
