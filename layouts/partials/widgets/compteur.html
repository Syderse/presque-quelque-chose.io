{{/* Widget: Le Compteur Bavard V5 (Unleashed Edition) */}}
<div class="relative w-full h-full group select-none" id="widget-compteur-wrapper">
  
  <style>
    @keyframes popAndRead {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.8) rotate(var(--tw-rotate)); }
      10% { opacity: 1; transform: translate(-50%, 0) scale(1.05) rotate(var(--tw-rotate)); }
      15% { transform: translate(-50%, 0) scale(1) rotate(var(--tw-rotate)); }
      85% { opacity: 1; transform: translate(-50%, -5px) scale(1) rotate(var(--tw-rotate)); }
      100% { opacity: 0; transform: translate(-50%, -40px) scale(0.95) rotate(var(--tw-rotate)); }
    }
    @keyframes nervousShake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px) rotate(-1deg); }
      20%, 40%, 60%, 80% { transform: translateX(4px) rotate(1deg); }
    }
    .bubble-smart-anim {
      animation-name: popAndRead;
      animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      animation-fill-mode: forwards;
      will-change: transform, opacity;
    }
    .hell-mode-shake {
      animation: nervousShake 0.4s cubic-bezier(.36,.07,.19,.97) both infinite;
      border-color: var(--ctp-red) !important;
      box-shadow: 0 0 30px rgba(243, 139, 168, 0.2);
    }
  </style>

  {{/* LE CARD CONTAINER (Garde l'overflow hidden pour lui-même) */}}
  <div id="compteur-card" class="relative h-full overflow-hidden rounded-2xl bg-ctp-surface0/40 border border-ctp-surface1/50 backdrop-blur-md transition-all duration-500 hover:border-ctp-mauve/40 hover:shadow-lg flex flex-col justify-center z-10">
    
    <div id="bg-decoration" class="absolute -right-2 -top-2 text-8xl leading-none opacity-[0.03] font-black text-ctp-mauve pointer-events-none rotate-12 transition-transform duration-700 group-hover:rotate-6">
      ?
    </div>

    <div class="relative z-10 flex items-center justify-between gap-4 p-5">
      <div class="flex flex-col items-start gap-0">
        <span class="text-[10px] font-bold tracking-[0.15em] uppercase text-ctp-overlay1">Entropie</span>
        <div class="flex items-baseline gap-1">
          <span id="compteur-valeur" class="text-5xl lg:text-6xl font-black text-ctp-text tabular-nums tracking-tight font-mono transition-colors duration-150">
            0
          </span>
          <span class="hidden sm:inline text-xs text-ctp-surface2 font-medium">clics</span>
        </div>
      </div>

      <button id="btn-bavard" 
              class="relative overflow-hidden group/btn h-12 px-6 rounded-xl bg-ctp-surface0 border border-ctp-surface2/50 text-ctp-text font-bold tracking-wider transition-all duration-150 active:scale-95 hover:bg-ctp-surface1 hover:border-ctp-mauve/50 hover:text-ctp-mauve shadow-md z-20">
        <span class="relative z-10 flex items-center gap-2 text-sm">
          <span id="btn-label">PERTURBER</span>
          <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform duration-300 group-hover/btn:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </span>
        <div class="absolute inset-0 bg-ctp-mauve/10 translate-y-full transition-transform duration-300 group-hover/btn:translate-y-0"></div>
      </button>
    </div>
  </div>

  {{/* ZONE DE TEXTE : DÉPLACÉE À L'EXTÉRIEUR DU CARD (Au niveau du wrapper) */}}
  {{/* z-50 permet de passer au dessus des autres widgets voisins */}}
  <div id="bavardage-zone" class="absolute inset-0 pointer-events-none z-50"></div>

</div>

<script>
(function() {
  const STORAGE_KEY_COUNT = 'pqc_entropy_count';
  const phrases = [ "Rien ne s'est passé.", "Absolument rien.", "Quelle dextérité !", "Vous devriez être payé pour faire ça.","Pauvre souris :/", "Vous avez réussi à ne rien faire avec brio.", "Ce clic a été enregistré par le bureau des choses vaines.", "Aïe ! Vous avez appuyé sur mon coup de soleil.", "Robert le caillou vous juge en silence.", "J'accepte les paiements en boutons de manchette orphelins.", "Erreur 404 : J'ai perdu mes clés dans le cyberespace.", "Une mouche vient de voler à reculons au Japon à cause de vous.", "Pouf. (C'est le bruit de votre temps qui s'évapore).", "Ce bouton est en grève illimitée.", "J'ai prévenu Barnabé, il arrive avec sa fougère.", "Vous avez décalé l'univers de 0,0001 millimètre vers la gauche.", "Encore ? Vous n'avez pas de chaussettes à classer ?", "Ce bouton est purement décoratif, comme les mamelons sur une armure.", "Je suis un bouton incompris.", "Téléchargement de l'ennui en cours... (99%)", "Échec du téléchargement. L'ennui est trop lourd.", "Si vous continuez, je me transforme en brocoli.", "Ceci n'est pas un bouton. C'est une pipe.", "Bravo, vous avez éteint une étoile dans une galaxie lointaine.", "Le poisson invisible vous regarde. Il a l'air déçu.", "Arrêtez, ça chatouille !", "Votre demande a été faxée à un arbre.", "Traitement en cours. Durée estimée : 4 siècles.", "Vous cherchez le sens ? J'ai trouvé un ticket de métro de 1998.", "C'est mou. C'est normal que ce soit mou ?", "J'aimerais être une touche de piano, mais je suis coincé ici.", "Miam. Donnez-moi encore des clics.", "Je me sens moins seul quand vous appuyez.", "C'est gênant ce silence, non ?", "On parle météo ? Il pleut à l'horizontal ici.", "Attention, bouton fragile émotionnellement.", "Vous usez vos pixels pour rien.", "J'ai oublié ma fonction. C'était peut-être 'faire du café'.", "Non, décidément, je ne sais rien faire.", "Vous êtes le cliqueur numéro 0. Félicitations.", "Ce message s'autodétruira dans... bof, la flemme.", "J'ai vu votre reflet dans l'écran. Coiffez-vous.", "L'Empereur (le mouton de poussière) exige un tribut.", "Veuillez ne pas nourrir le bouton après minuit.", "Ce bouton est végan et sans gluten.", "Il ne se passe rien, mais avec panache.", "C'est tout ? Oui, c'est tout.", "Je suis parti vérifier si la lumière du frigo s'éteint vraiment.", "Je suis en RTT (Récupération de Temps Tordu).", "Vous avez activé le mode 'Rien du tout'.", "Le mode 'Rien du tout' fonctionne à merveille.", "Cliquez plus fort, je suis un peu dur de la feuille.", "Vous avez réveillé une loutre qui dormait en vous.", "Ce clic n'a aucun impact carbone. C'est déjà ça.", "Barnabé demande si vous avez vu son chlorophylle.", "J'ai cru sentir une vibration. Ah non, c'est vous.", "Vous essayez de communiquer en Morse ?", "... --- ... (C'est 'au secours' en langage bouton).", "Je suis occupé à calculer la dernière décimale de Pi.", "Ne me touchez pas, je suis contagieux (je transmets la flemme).", "Ce bouton est sponsorisé par l'Amicale des Portes Fermées.", "Vous avez gagné un voyage gratuit dans votre tête.", "L'action demandée nécessite un formulaire B-28 rose.", "Vous appuyez, donc je suis.", "Descartes avait tort, je ne pense pas mais je suis quand même.", "C'est une excellente journée pour ne rien produire.", "J'ai mal à la tête. Revenez demain.", "Si j'étais rouge, je serais un bouton d'urgence. Mais je suis gris.", "Gris anthracite, comme le bruit du frigo.", "Vous avez la touche douce. C'est agréable.", "Un peu plus à gauche... Oui, là. Parfait.", "Vous faites ça souvent ?", "Je ne suis pas ce genre de bouton.", "Votre obstination est fascinante.", "J'ai noté votre nom dans mon registre des gens têtus.", "Le plafond complote contre nous, je le sais.", "J'ai faim. Envoyez des cookies (pas ceux du navigateur).", "Phantôme le poisson vient de faire une bulle carrée.", "Vous perturbez mes ondes gravitationnelles.", "Laissez-moi méditer en paix.", "Ommmmm... (Bruit de bouton zen).", "Ce clic a un arrière-goût de vanille.", "Non, plutôt de carton. Comme le concept de porte.", "Vous avez activé l'autodestruction de... rien.", "Fausse alerte.", "Je suis un bouton existentialiste.", "L'enfer, c'est les autres (boutons).", "Vous attendez Godot ? Il ne viendra pas. Moi non plus.", "Cliquez ici pour annuler votre dernier clic.", "Ça n'a pas marché, hein ?", "J'ai stocké cette seconde précise dans un bocal à cornichons.", "Chaque clic vous vieillit de 0,5 seconde.", "C'est effrayant, vu comme ça.", "Profitez de l'instant présent.", "Car l'instant d'après, vous allez encore cliquer.", "Voilà, c'est fait.", "C'est une spirale d'étonnement mou.", "Mais vous aimez ça. Avouez.", "C'est notre petit secret.", "L'inutilité est le luxe ultime.", "Merci d'avoir partagé ce néant avec moi.", "À la prochaine." ];
  const textColors = ['text-ctp-mauve', 'text-ctp-pink', 'text-ctp-peach', 'text-ctp-green', 'text-ctp-blue', 'text-ctp-lavender', 'text-ctp-yellow'];
  class ShuffleBag {
    constructor(data) { this.data = [...data]; this.current = []; }
    shuffle(array) { let c = array.length, r; while (c != 0) { r = Math.floor(Math.random() * c); c--; [array[c], array[r]] = [array[r], array[c]]; } return array; }
    next() { if (this.current.length === 0) this.current = this.shuffle([...this.data]); return this.current.pop(); }
  }
  const btn = document.getElementById('btn-bavard');
  const btnLabel = document.getElementById('btn-label');
  const display = document.getElementById('compteur-valeur');
  const zone = document.getElementById('bavardage-zone');
  const card = document.getElementById('compteur-card');
  const bgDeco = document.getElementById('bg-decoration');
  const bag = new ShuffleBag(phrases);
  if (!btn || !display || !zone) return;
  if (btn.getAttribute('data-initialized') === 'true') return;
  btn.setAttribute('data-initialized', 'true');
  let count = parseInt(localStorage.getItem(STORAGE_KEY_COUNT) || '0');
  display.innerText = count;
  function setHellMode(active) {
    if (active) {
      card.classList.add('hell-mode-shake'); card.classList.replace('bg-ctp-surface0/40', 'bg-ctp-red/10'); display.classList.replace('text-ctp-text', 'text-ctp-red'); bgDeco.innerText = "666"; bgDeco.classList.replace('text-ctp-mauve', 'text-ctp-red'); bgDeco.classList.remove('opacity-[0.03]'); bgDeco.classList.add('opacity-20'); btnLabel.innerText = "PARDON"; btn.classList.add('border-ctp-red', 'text-ctp-red');
    } else {
      card.classList.remove('hell-mode-shake'); card.classList.replace('bg-ctp-red/10', 'bg-ctp-surface0/40'); display.classList.replace('text-ctp-red', 'text-ctp-text'); bgDeco.innerText = "?"; bgDeco.classList.replace('text-ctp-red', 'text-ctp-mauve'); bgDeco.classList.remove('opacity-20'); bgDeco.classList.add('opacity-[0.03]'); btnLabel.innerText = "PERTURBER"; btn.classList.remove('border-ctp-red', 'text-ctp-red');
    }
  }
  btn.addEventListener('click', (e) => {
    count++; display.innerText = count; localStorage.setItem(STORAGE_KEY_COUNT, count);
    if (count === 666) { setHellMode(true); createFloatingText("😈 SATAN EST EN RÉUNION. MERCI DE NE PAS INSISTER.", true); return; } 
    if (count === 667) { setHellMode(false); createFloatingText("Ouf... Le protocole d'apocalypse a été annulé.", false); return; }
    display.classList.replace('text-ctp-text', 'text-ctp-mauve'); setTimeout(() => display.classList.replace('text-ctp-mauve', 'text-ctp-text'), 150); createFloatingText(bag.next(), false);
  });

  function createFloatingText(text, isHell) {
    const el = document.createElement('div');
    const wordCount = text.split(' ').length;
    const duration = isHell ? 6 : Math.max(2.5, 1.5 + (wordCount * 0.35)); 
    
    // NOTE : J'ai supprimé 'top-1/2 left-1/2' pour permettre le placement manuel
    let classes = `absolute w-max max-w-[250px] md:max-w-[350px] px-6 py-3 rounded-2xl backdrop-blur-md border text-lg md:text-xl font-bold text-center shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] bubble-smart-anim z-50 `;
    
    if (isHell) { classes += `bg-ctp-base/95 border-ctp-red text-ctp-red scale-125`; } 
    else { const randomColor = textColors[Math.floor(Math.random() * textColors.length)]; classes += `bg-ctp-mantle/95 border-ctp-surface1 ${randomColor}`; }
    
    el.className = classes;

    // --- LOGIQUE DE POSITIONNEMENT ALÉATOIRE (CHAOS CONTROLÉ) ---
    // Amplitude : De -10% à 90% de la largeur/hauteur du conteneur
    // Cela permet aux bulles de dépasser un peu sur les côtés
    const randomTop = Math.floor(Math.random() * 100) - 10; // -10% à 90%
    const randomLeft = Math.floor(Math.random() * 100) - 10; // -10% à 90%
    
    el.style.top = randomTop + '%';
    el.style.left = randomLeft + '%';
    // ------------------------------------------------------------

    const randomRotate = isHell ? '0deg' : (Math.random() * 10 - 5).toFixed(1) + 'deg'; // Rotation un peu plus forte
    el.style.setProperty('--tw-rotate', randomRotate); 
    el.style.animationDuration = `${duration}s`; 
    el.innerText = text;
    
    zone.appendChild(el);
    setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, duration * 1000 + 100);
  }
})();
</script>
