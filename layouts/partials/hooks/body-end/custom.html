<script>
document.addEventListener('DOMContentLoaded', function() {
  
  // 1. Cherche directement le lien dont l'ID se termine par "login_link"
  // (Le sélecteur [id$="..."] est toujours bon pour éviter les préfixes)
  let loginLink = document.querySelector('[id$="login_link"]');
  
  if (loginLink) {
    // 2. On a trouvé le lien ! On attache l'événement.
    loginLink.addEventListener('click', function(event) {
      
      // 3. Empêche le navigateur de suivre le lien '#'
      event.preventDefault();
      
      // 4. Affiche l'alerte !
      alert("Réservé au Dr. Faustroll.");
    });
  } else {
    // Message pour nous, au cas où, visible dans la console du navigateur (F12)
    console.error("Assistant Hugo Blox: Impossible de trouver le lien [id$=\"login_link\"]");
  }
});
</script>
