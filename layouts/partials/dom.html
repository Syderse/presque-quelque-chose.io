     Clic après clic (000→999) il déroule son monologue (static/data/dom-story.json),

<section class="dom" id="dom" aria-label="DOM, un élément du DOM">

  <button type="button" class="dom-button" id="dom-button">
    <span class="dom-glyph" aria-hidden="true">👾</span> ne pas cliquer
  </button>
  <p class="dom-line" id="dom-line" hidden></p>
</section>
