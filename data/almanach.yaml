# Format : YYYY-MM-DD: "Le contenu comique"
# Tu peux pré-remplir ton année ici.

"2025-11-21": "J'ai tenté de mesurer la circonférence de mon ennui avec un compas mou. Résultat concluant, mais je ne peux pas vous en dire plus."
"2025-11-22": "Observé une mouche voler à reculons au-dessus de mon café. J'en déduis que le temps a hoqueté aux alentours de 8h04. J'ai décidé de ne pas boire le café, de peur de perdre le fil de ma matinée. Je l'ai versé sur une chaussette. Comme ça pour une fois, c'est elle qui aura un goût de café. Je me demande si ça m'aidera à courir plus vite."
"2025-11-23": "Décidé de ne parler qu'en voyelles jusqu'à midi. Aueu ouaï. Le facteur m'a regardé avec une inquiétude polie avant de me tendre un colis qui ne m'était pas destiné. C'était peut-être un test."
"2025-11-24": "Dimanche. J'ai classé mes chaussettes par ordre de mélancolie. Les grises gagnent toujours, mais les rayées cachent une tristesse joyeuse assez sournoise."
"2025-11-25": "Rencontre avec Barnabé, le voisin du troisième qui prétend avoir été une fougère dans une vie antérieure. Il reste immobile dans l'escalier pour 'faire de la photosynthèse' sous le néon qui clignote. Je lui ai arrosé les pieds par courtoisie."
"2025-11-26": "J'ai trouvé un caillou bleu parfaitement sphérique dans ma chaussure gauche. Il ne vient pas de la rue. Je soupçonne le plafond de comploter pour me faire passer des messages géologiques."
"2025-11-27": "Le caillou bleu a bougé pendant la nuit. Il est maintenant sur la table de chevet. J'ai décidé de l'appeler 'Robert' et de lui construire un petit enclos avec des allumettes."
"2025-11-28": "Tentative de communication avec Robert le caillou. J'ai utilisé le code Morse en tapotant avec une cuillère à pamplemousse. Il reste de marbre. Ou de granit. La nature de son silence est très éloquente."
"2025-11-29": "Ai passé l'après-midi à essayer de synchroniser ma respiration avec le mouvement des nuages. Hyperventilation vers 16h. J'ai dû m'asseoir et manger un biscuit très sec pour revenir au réel."
"2025-11-30": "Fin du mois. J'ai fait l'inventaire de mes regrets. Il m'en manque deux pour faire une douzaine. Je vais essayer de rater une cuisson de pâtes ce soir pour compléter la collection."
"2025-12-01": "J'ai ouvert la première case de mon calendrier de l'Avent Pataphysique. Il n'y avait pas de chocolat, mais un concept flou concernant l'inutilité des portes. J'ai mangé le concept. Ça avait un goût de carton."
"2025-12-02": "Barnabé est toujours dans l'escalier. Il commence à brunir. Je lui ai suggéré de changer de pot, mais il m'a répondu que l'exposition au nord favorisait ses pensées rhizomiques."
"2025-12-03": "J'ai décidé de cultiver la poussière sous mon lit. C'est un écosystème fascinant. J'ai nommé le plus gros mouton 'L'Empereur'. Il semble diriger les autres avec une autorité statique indéniable."
"2025-12-04": "L'Empereur a disparu. Je soupçonne l'aspirateur d'avoir mené un coup d'État pendant mon absence. Le silence sous le lit est pesant."
"2025-12-05": "Il pleut à l'horizontal aujourd'hui. J'ai mis mon imperméable à l'envers pour tromper les gouttes. Je suis rentré sec, mais confus."
"2025-12-06": "Saint Nicolas est passé. Ou alors c'était un cambrioleur très généreux qui a laissé une mandarine et pris ma télévision. L'échange me semble équitable sur le plan nutritionnel."
"2025-12-07": "Dimanche. J'ai essayé de peindre le bruit du frigo. C'est un mélange de gris anthracite et de jaune électrique qui vibre quand on le regarde trop longtemps."
"2025-12-08": "Robert le caillou a disparu. Je l'ai retrouvé dans le frigo, à côté du beurre. Il cherchait peut-être à se cryogéniser pour voir le futur. Je l'ai remis dans son enclos avec une petite écharpe en laine."
"2025-12-09": "J'ai écrit une lettre de réclamation au bureau de la gravité. Les objets tombent de plus en plus vite chez moi. J'ai cassé deux tasses avant même d'avoir pensé à les lâcher."
"2025-12-10": "Réponse du bureau de la gravité : 'Veuillez vous lester les poches'. J'ai mis des encyclopédies dans mon pantalon. La marche est difficile mais je me sens ancré."
"2025-12-11": "Aujourd'hui, j'ai décidé de devenir l'expert mondial des flaques d'eau du quartier. La flaque rue des Lilas possède une profondeur émotionnelle surprenante. On y voit le reflet d'un ciel qui n'existe pas."
"2025-12-12": "Barnabé a finalement bougé. Il est maintenant assis devant ma porte. Il dit qu'il est en période de jachère. Je lui ai offert du thé, il l'a versé dans sa chaussure."
"2025-12-13": "J'ai lu le journal d'hier avant celui d'aujourd'hui pour prendre de l'avance sur l'histoire. Les nouvelles sont rassurantes : rien n'a changé, mais en pire."
"2025-12-14": "Dimanche. J'ai passé la journée à chercher l'endroit exact où commence le dimanche soir. C'est une frontière floue, située quelque part entre le générique du film de 21h et le bruit de la pluie."
"2025-12-15": "Découverte majeure : si on écoute du jazz très fort, les plantes vertes poussent en zigzag. Mon ficus ressemble maintenant à un solo de saxophone."
"2025-12-16": "J'ai croisé mon propre reflet dans une vitrine et je ne me suis pas salué. C'était très impoli. Nous sommes en froid jusqu'à nouvel ordre."
"2025-12-17": "L'ombre de ma chaise a une jambe plus courte que les autres. J'ai essayé de la caler avec une ombre de livre, mais ça glisse."
"2025-12-18": "Robert le caillou bleu s'est divisé en deux petits cailloux bleus. Je suis grand-père. L'émotion est vive."
"2025-12-19": "Préparatifs pour le solstice. J'ai tourné tous les meubles de l'appartement de 15 degrés vers l'Est pour optimiser l'accueil de l'hiver. Je me cogne le petit orteil à chaque pas."
"2025-12-20": "J'ai acheté un poisson rouge invisible. Le vendeur m'a assuré qu'il était très beau. Je passe des heures à regarder l'aquarium vide. Parfois, je vois une ondulation. C'est apaisant."
"2025-12-21": "Solstice. La nuit la plus longue. J'en ai profité pour dormir deux fois. Au réveil, j'avais l'impression d'être un ours mal léché mais bien reposé."
"2025-12-22": "Le poisson invisible (je l'ai nommé 'Phantôme') semble avoir mangé toutes les paillettes. Ou alors elles se sont dissoutes. Le doute m'habite, mais je continue de lui parler de politique étrangère."
"2025-12-23": "Barnabé a toqué pour me demander si j'avais vu son chlorophylle. Je lui ai donné un tube de dentifrice vert. Il est reparti satisfait."
"2025-12-24": "Réveillon. J'ai mis une guirlande électrique autour de Robert et Robert Junior. C'est minimaliste, mais festif. On dirait une petite ville vue d'avion, la nuit, si la ville était peuplée de minéraux."
"2025-12-25": "Noël. Le Père Noël est une hallucination collective maintenue par l'industrie du renne. J'ai reçu une paire de gants à trois doigts. C'est parfait pour mon projet de mutation génétique."
"2025-12-26": "Lendemain de fête. L'atmosphère est aussi lourde qu'un pudding au plomb. J'ai décidé de digérer en position du lotus inversé (sur la tête). Le monde est plus drôle à l'envers, les gens marchent au plafond."
"2025-12-27": "J'ai retrouvé le concept d'inutilité des portes (celui du 1er décembre) coincé entre deux dents. Finalement, ça a un arrière-goût de liberté."
"2025-12-28": "Dimanche. J'ai essayé d'apprendre à mon ombre à faire des ombres chinoises toute seule. Elle manque de dextérité, ou de doigts, je ne sais pas encore."
"2025-12-29": "Phantôme le poisson invisible a fait des bulles aujourd'hui ! La preuve irréfutable de son existence. Ou alors l'eau fermente. Je préfère la première hypothèse."
"2025-12-30": "Avant-veille. J'ai commencé à lister mes résolutions pour 2026. 1. Arrêter de croire que les pigeons sont des caméras. 2. Apprendre le violoncelle, mais sans archet. 3. Retrouver l'Empereur sous le lit."
"2025-12-31": "Dernier jour. J'attends minuit avec un filet à papillons pour capturer la transition. Je veux voir à quoi ressemble une année neuve avant que tout le monde ne marche dessus. À l'année prochaine, si le temps continue d'avancer dans le bon sens."
