# Reserve d'entrees de l'almanach.
# Champs minimum : id, text.
# date garde l'ancien calendrier comme provenance optionnelle.

entries:
  - id: mesure-ennui-compas-mou
    date: "2025-11-21"
    text: >-
      J'ai tenté de mesurer la circonférence de mon ennui avec un compas mou. Résultat concluant, mais je ne peux pas vous en dire plus.
  - id: mouche-cafe-chaussette
    date: "2025-11-22"
    text: >-
      Observé une mouche voler à reculons au-dessus de mon café. J'en déduis que le temps a hoqueté aux alentours de 8h04. J'ai décidé de ne pas boire le café, de peur de perdre le fil de ma matinée. Je l'ai versé sur une chaussette. Comme ça pour une fois, c'est elle qui aura un goût de café. Je me demande si ça m'aidera à courir plus vite.
  - id: voyelles-colis-test
    date: "2025-11-23"
    text: >-
      Décidé de ne parler qu'en voyelles jusqu'à midi. Aueu ouaï. Le facteur m'a regardé avec une inquiétude polie avant de me tendre un colis qui ne m'était pas destiné. C'était peut-être un test.
  - id: chaussettes-melancolie
    date: "2025-11-24"
    text: >-
      J'ai classé mes chaussettes.
  - id: barnabe-photosynthese-neon
    date: "2025-11-25"
    text: >-
      Rencontre avec Barnabé, le voisin du troisième qui prétend avoir été une fougère dans une vie antérieure. Il reste immobile dans l'escalier pour 'faire de la photosynthèse' sous le néon qui clignote. Je lui ai arrosé les pieds par courtoisie.
  - id: caillou-bleu-chaussure
    date: "2025-11-26"
    text: >-
      J'ai trouvé un caillou bleu parfaitement sphérique dans ma chaussure gauche. Il ne vient pas de la rue. Je soupçonne le plafond de comploter pour me faire passer des messages géologiques.
  - id: robert-enclos-allumettes
    date: "2025-11-27"
    text: >-
      Le caillou bleu a bougé pendant la nuit. Il est maintenant sur la table de chevet. J'ai décidé de l'appeler 'Robert' et de lui construire un petit enclos avec des allumettes.
  - id: robert-code-morse
    date: "2025-11-28"
    text: >-
      Tentative de communication avec Robert le caillou. J'ai utilisé le code Morse en tapotant avec une cuillère à pamplemousse. Il reste de marbre. Ou de granit. La nature de son silence est très éloquente.
  - id: respiration-nuages-biscuit
    date: "2025-11-29"
    text: >-
      Ai passé l'après-midi à essayer de synchroniser ma respiration avec le mouvement des nuages. Hyperventilation vers 16h. J'ai dû m'asseoir et manger un biscuit très sec pour revenir au réel.
  - id: inventaire-regrets
    date: "2025-11-30"
    text: >-
      Fin du mois. J'ai fait l'inventaire de mes regrets. Il m'en manque deux pour faire une douzaine. Je vais essayer de rater une cuisson de pâtes ce soir pour compléter la collection.
  - id: calendrier-avent-postit
    date: "2025-12-01"
    text: >-
      J'ai ouvert la première case de mon calendrier de l'Avent. Il n'y avait pas de chocolat, mais un vieux post-it écrit par un certain Mr. Genesaiki qui essaye de convaincre le lecteur de l'inutilité des portes. J'ai ouvert la petite porte de mon calendrier pour manger, alors j'ai mangé le post-it. Ça avait un goût de carton.
  - id: barnabe-pensees-rhizomiques
    date: "2025-12-02"
    text: >-
      Barnabé est toujours dans l'escalier. Il commence à brunir. Je lui ai suggéré de changer de pot, mais il m'a répondu que l'exposition au nord favorisait ses pensées rhizomiques.
  - id: poussiere-empereur
    date: "2025-12-03"
    text: >-
      J'ai décidé de cultiver la poussière sous mon lit. C'est un écosystème fascinant. J'ai nommé le plus gros mouton 'L'Empereur'. Il semble diriger les autres avec une autorité statique indéniable.
  - id: empereur-disparu
    date: "2025-12-04"
    text: >-
      L'Empereur a disparu. Je soupçonne l'aspirateur d'avoir mené un coup d'État pendant mon absence. Le silence sous le lit est pesant.
  - id: pluie-horizontale
    date: "2025-12-05"
    text: >-
      Il pleut à l'horizontal aujourd'hui. J'ai mis mon imperméable à l'envers pour tromper les gouttes. Je suis rentré sec, mais confus.
  - id: saint-nicolas-mandarine
    date: "2025-12-06"
    text: >-
      Saint Nicolas est passé. Ou alors c'était un cambrioleur très généreux qui a laissé une mandarine et pris ma télévision. L'échange me semble équitable sur le plan nutritionnel.
  - id: peindre-bruit-frigo
    date: "2025-12-07"
    text: >-
      Dimanche. J'ai essayé de peindre le bruit du frigo. C'est un mélange de gris anthracite et de jaune électrique qui vibre quand on le regarde trop longtemps.
  - id: robert-frigo-echarpe
    date: "2025-12-08"
    text: >-
      Robert le caillou a disparu. Je l'ai retrouvé dans le frigo, à côté du beurre. Il cherchait peut-être à se cryogéniser pour voir le futur. Je l'ai remis dans son enclos avec une petite écharpe en laine.
  - id: bureau-gravite-reclamation
    date: "2025-12-09"
    text: >-
      J'ai écrit une lettre de réclamation au bureau de la gravité. Les objets tombent de plus en plus vite chez moi. J'ai cassé deux tasses avant même d'avoir pensé à les lâcher.
  - id: bureau-gravite-reponse
    date: "2025-12-10"
    text: >-
      Réponse du bureau de la gravité : 'Veuillez vous lester les poches'. J'ai mis des encyclopédies dans mon pantalon. La marche est difficile mais je me sens ancré.
  - id: expert-flaques
    date: "2025-12-11"
    text: >-
      Aujourd'hui, j'ai décidé de devenir l'expert mondial des flaques d'eau du quartier. La flaque rue des Lilas possède une profondeur émotionnelle surprenante. On y voit le reflet d'un ciel qui n'existe pas.
  - id: barnabe-jachere
    date: "2025-12-12"
    text: >-
      Barnabé a finalement bougé. Il est maintenant assis devant ma porte. Il dit qu'il est en période de jachère. Je lui ai offert du thé, il l'a versé dans sa chaussure.
  - id: journal-hier-aujourdhui
    date: "2025-12-13"
    text: >-
      J'ai lu le journal d'hier avant celui d'aujourd'hui pour prendre de l'avance sur l'histoire. Les nouvelles sont rassurantes : rien n'a changé, mais en pire.
  - id: frontiere-dimanche-soir
    date: "2025-12-14"
    text: >-
      Dimanche. J'ai passé la journée à chercher l'endroit exact où commence le dimanche soir. C'est une frontière floue, située quelque part entre le générique du film de 21h et le bruit de la pluie.
  - id: ficus-jazz-zigzag
    date: "2025-12-15"
    text: >-
      Découverte majeure : si on écoute du jazz très fort, les plantes vertes poussent en zigzag. Mon ficus ressemble maintenant à un solo de saxophone.
  - id: reflet-impoli
    date: "2025-12-16"
    text: >-
      J'ai croisé mon propre reflet dans une vitrine et je ne me suis pas salué. C'était très impoli. Nous sommes en froid jusqu'à nouvel ordre.
  - id: ombre-chaise
    date: "2025-12-17"
    text: >-
      L'ombre de ma chaise a une jambe plus courte que les autres. J'ai essayé de la caler avec une ombre de livre, mais ça glisse.
  - id: robert-grand-pere
    date: "2025-12-18"
    text: >-
      Robert le caillou bleu s'est divisé en deux petits cailloux bleus. Je suis grand-père. L'émotion est vive.
  - id: solstice-meubles-est
    date: "2025-12-19"
    text: >-
      Préparatifs pour le solstice. J'ai tourné tous les meubles de l'appartement de 15 degrés vers l'Est pour optimiser l'accueil de l'hiver. Je me cogne le petit orteil à chaque pas.
  - id: poisson-invisible
    date: "2025-12-20"
    text: >-
      J'ai acheté un poisson rouge invisible. Le vendeur m'a assuré qu'il était très beau. Je passe des heures à regarder l'aquarium vide. Parfois, je vois une ondulation. C'est apaisant.
  - id: solstice-dormir-deux-fois
    date: "2025-12-21"
    text: >-
      Solstice. La nuit la plus longue. J'en ai profité pour dormir deux fois. Au réveil, j'avais l'impression d'être un ours mal léché mais bien reposé.
  - id: phantome-politique
    date: "2025-12-22"
    text: >-
      Le poisson invisible (je l'ai nommé 'Phantôme') semble avoir mangé toutes les paillettes. Ou alors elles se sont dissoutes. Le doute m'habite, mais je continue de lui parler de politique étrangère.
  - id: barnabe-chlorophylle
    date: "2025-12-23"
    text: >-
      Barnabé a toqué pour me demander si j'avais vu son chlorophylle. Je lui ai donné un tube de dentifrice vert. Il est reparti satisfait.
  - id: reveillon-robert
    date: "2025-12-24"
    text: >-
      Réveillon. J'ai mis une guirlande électrique autour de Robert et Robert Junior. C'est minimaliste, mais festif. On dirait une petite ville vue d'avion, la nuit, si la ville était peuplée de minéraux.
  - id: noel-gants-trois-doigts
    date: "2025-12-25"
    text: >-
      Noël. Le Père Noël est une hallucination collective maintenue par l'industrie du renne. J'ai reçu une paire de gants à trois doigts. C'est parfait pour mon projet de mutation génétique.
  - id: digestion-lotus-inverse
    date: "2025-12-26"
    text: >-
      Lendemain de fête. L'atmosphère est aussi lourde qu'un pudding au plomb. J'ai décidé de digérer en position du lotus inversé (sur la tête). Le monde est plus drôle à l'envers, les gens marchent au plafond.
  - id: inutilite-des-portes
    date: "2025-12-27"
    text: >-
      J'ai retrouvé le concept d'inutilité des portes (celui du 1er décembre) coincé entre deux dents. Finalement, ça a un arrière-goût de liberté.
  - id: ombre-ombres-chinoises
    date: "2025-12-28"
    text: >-
      Dimanche. J'ai essayé d'apprendre à mon ombre à faire des ombres chinoises toute seule. Elle manque de dextérité, ou de doigts, je ne sais pas encore.
  - id: phantome-bulles
    date: "2025-12-29"
    text: >-
      Phantôme le poisson invisible a fait des bulles aujourd'hui ! La preuve irréfutable de son existence. Ou alors l'eau fermente. Je préfère la première hypothèse.
  - id: resolutions-2026
    date: "2025-12-30"
    text: >-
      Avant-veille. J'ai commencé à lister mes résolutions pour 2026. 1. Arrêter de croire que les pigeons sont des caméras. 2. Apprendre le violoncelle, mais sans archet. 3. Retrouver l'Empereur sous le lit.
  - id: capture-transition-annee
    date: "2025-12-31"
    text: >-
      Dernier jour. J'attends minuit avec un filet à papillons pour capturer la transition. Je veux voir à quoi ressemble une année neuve avant que tout le monde ne marche dessus. À l'année prochaine, si le temps continue d'avancer dans le bon sens.
