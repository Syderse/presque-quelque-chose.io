title: "presque-quelque-chose"
baseURL: 'https://syderse.github.io/'

# --- CORE BUILD SETTINGS ---
build:
  # Indispensable pour Tailwind JIT
  writeStats: true
  
# Fusion des paramètres de sécurité et minify
security:
  enableInlineShortcodes: true
minify:
  disableXML: true
  minifyOutput: true

# --- MODULES & THEME ---
module:
  # C'est ici que l'on définit les "Mounts" critiques pour la synchro Tailwind
  mounts:
    - source: assets
      target: assets
    - source: hugo_stats.json
      target: assets/watching/hugo_stats.json
    - source: layouts
      target: layouts
    - source: content
      target: content
    - source: static
      target: static
    # Imports Hugo Blox (Conservés de votre config)
    - source: hugo-blox/blox/community
      target: layouts/_partials/blox/community/
      includeFiles: '**.html'
    - source: hugo-blox/blox/all-access
      target: layouts/_partials/blox/
      includeFiles: '**.html'
    - source: hugo-blox/blox
      target: assets/dist/community/blox/
      includeFiles: '**.css'
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-plugin-netlify
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

# --- OUTPUTS (Vos personnalisations Almanach) ---
outputFormats:
  JSON-ALMANACH:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true
  JSON-RANDOM:
    mediaType: "application/json"
    baseName: "articles-aleatoires"
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, headers, redirects, backlinks, JSON-RANDOM] 
  section: [HTML, RSS]
  page: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

# --- PAGE OPTIONS ---
cascade:
  - _target:
      path: /blog/**
      kind: page
    pager: true
    editable: true
    show_date_updated: true
    reading_time: true
    commentable: true
    show_related: true
    share: true
    show_breadcrumb: false
    header:
      navbar:
        enable: true

# --- MARKUP & HOOKS ---
markup:
  goldmark:
    renderer:
      unsafe: true
  renderHooks:
    link: {} 

# --- OTHER SETTINGS ---
defaultContentLanguage: fr
removePathAccents: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
timeout: 600000

taxonomies:
  tag: tags
  category: categories
  author: authors

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70

imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture