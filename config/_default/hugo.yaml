title: "presque-quelque-chose"
baseURL: 'https://syderse.github.io/'

# ===========================================================================
# CORE BUILD SETTINGS
# ===========================================================================
build:
  # Indispensable pour Tailwind JIT
  writeStats: true

# Fusion des paramètres de sécurité et minify
security:
  enableInlineShortcodes: true
minify:
  disableXML: true
  minifyOutput: true

# ===========================================================================
# MODULES & THEME MOUNTS
# ===========================================================================
module:
  # C'est ici que l'on définit les "Mounts" critiques pour la synchro Tailwind
  mounts:
    - source: assets
      target: assets
    
    # [CORRECTIF NETLIFY] 
    # Suppression du mount hugo_stats.json pour éviter les erreurs de "Cold Build".
    # Tailwind v4 utilisera désormais le scanner sur layouts/ (via safelist.html)
    # - source: hugo_stats.json
    #   target: assets/watching/hugo_stats.json
    
    - source: layouts
      target: layouts
    - source: content
      target: content
    - source: static
      target: static
      
    # Imports Hugo Blox
    - source: hugo-blox/blox/community
      target: layouts/_partials/blox/community/
      includeFiles: '**.html'
    - source: hugo-blox/blox/all-access
      target: layouts/_partials/blox/
      includeFiles: '**.html'
    - source: hugo-blox/blox
      target: assets/dist/community/blox/
      includeFiles: '**.css'

  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-plugin-netlify
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

# ===========================================================================
# OUTPUTS & FORMATS (API STATIC)
# ===========================================================================
outputFormats:
  ALMANACH:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true
  RANDOMIZER:
    mediaType: "application/json"
    baseName: "articles-aleatoires"
    isPlainText: true
    notAlternative: true
  RHIZOME:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true

outputs:
  # On applique les nouveaux noms
  home: [HTML, RSS, RANDOMIZER] 
  section: [HTML, RSS, ALMANACH] 
  page: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

# ===========================================================================
# NAVIGATION & MENUS
# ===========================================================================
menus:
  main:
    - name: solutions imaginaires
      url: /solutions-imaginaires/
      weight: 10
    - name: recherches
      url: /recherches/
      weight: 20
    - name: ondes & pixels
      url: /ondes-pixels/
      weight: 30
    - name: rhizome curieux
      url: /rhizome-curieux/
      weight: 40
    - name: patafoin
      url: /patafoin/
      weight: 50

# ===========================================================================
# PAGE & CONTENT OPTIONS
# ===========================================================================
cascade:
  - _target:
      path: /blog/**
      kind: page
    pager: true
    editable: true
    show_date_updated: true
    reading_time: true
    commentable: true
    show_related: true
    share: true
    show_breadcrumb: false
    header:
      navbar:
        enable: true
  - _target:
      path: /recherches/**
    params:
      full_width: true

  - _target:
      path: /rhizome-curieux/**
    params:
      full_width: true

# --- MARKUP & HOOKS ---
markup:
  goldmark:
    renderer:
      unsafe: true
  renderHooks:
    link: {} 

# --- GLOBAL SETTINGS ---
defaultContentLanguage: fr
removePathAccents: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
timeout: 600000

taxonomies:
  tag: tags
  category: categories
  author: authors

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70

imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture

# ===========================================================================
# SITE PARAMETERS (Anciennement params.yaml)
# ===========================================================================
params:
  # SITE SETUP
  # Guide: https://docs.hugoblox.com/tutorial/
  # Documentation: https://docs.hugoblox.com/

  # Appearance
  appearance:
    mode: dark
    color: custom  # Dit à Hugo de chercher notre custom.css

  # SEO / Marketing
  marketing:
    seo:
      site_type: Person
      local_business_type: ''
      org_name: ''
      description: 'A highly-customizable Hugo blog theme powered by Hugo Blox Builder.'
      twitter: 'GetResearchDev'
    analytics:
      google_analytics: ''
      baidu_tongji: ''
      plausible: ''
      fathom: ''
      pirsch: ''
    verification:
      google: ''
      baidu: ''

  # Site header
  header:
    navbar:
      enable: true
      show_search: true
      show_theme_chooser: false

  # Site footer
  footer:
    copyright:
      notice: '© {year} Me. This work is licensed under {license}'
      license:
        enable: true
        allow_derivatives: false
        share_alike: true
        allow_commercial: false

  # Localization
  locale:
    date_format: 'Jan 2, 2006'
    time_format: '3:04 PM'

  # Site features
  features:
    math:
      enable: false
    privacy_pack:
      enable: false
    repository:
      url: 'https://github.com/HugoBlox/hugo-blox-builder/'
      content_dir: templates/blog/content
      branch: main

