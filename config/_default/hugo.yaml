# File: config/_default/hugo.yaml

title: "presque-quelque-chose"
baseURL: "https://presque-quelque-chose.com/"
locale: "fr-fr"

# ===========================================================================
# CORE BUILD SETTINGS
# ===========================================================================
# Fusion des paramètres de sécurité et minify
security:
  enableInlineShortcodes: true
minify:
  disableXML: true
  minifyOutput: true

# ===========================================================================
# MODULES & THEME MOUNTS
# ===========================================================================
module:
  mounts:
    - source: assets
      target: assets
    - source: layouts
      target: layouts
    - source: content
      target: content
    - source: static
      target: static

# ===========================================================================
# OUTPUTS & FORMATS (API STATIC)
# ===========================================================================
outputFormats:
  ALMANACH:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true
  RANDOMIZER:
    mediaType: "application/json"
    baseName: "articles-aleatoires"
    isPlainText: true
    notAlternative: true
  RHIZOME:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, RANDOMIZER]
  section: [HTML, RSS]
  page: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

# ===========================================================================
# NAVIGATION & MENUS
# ===========================================================================
menus:
  main:
    - name: solutions imaginaires
      url: /solutions-imaginaires/
      weight: 10
    - name: recherches
      url: /recherches/
      weight: 20
    - name: ondes & pixels
      url: /ondes-pixels/
      weight: 30
    - name: antenne radio
      url: /antenne-radio/
      weight: 35
    - name: rhizome curieux
      url: /rhizome-curieux/
      weight: 40
    - name: patafoin
      url: /patafoin/
      weight: 50

# ===========================================================================
# PAGE & CONTENT OPTIONS
# ===========================================================================
cascade:
  - target:
      path: /blog/**
    pager: true
    editable: true
    show_date_updated: true
    reading_time: true
    commentable: true
    show_related: true
    share: true
    show_breadcrumb: false
    header:
      navbar:
        enable: true
  - target:
      path: /recherches/**
    params:
      full_width: true

  - target:
      path: /rhizome-curieux/**
    params:
      full_width: true

# --- MARKUP & HOOKS ---
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
    endLevel: 6
    ordered: false
  renderHooks:
    link: {}

# --- GLOBAL SETTINGS ---
defaultContentLanguage: fr
removePathAccents: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
timeout: 600000

taxonomies:
  tag: tags
  author: authors

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100

imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture

# ===========================================================================
# SITE PARAMETERS
# ===========================================================================
params:
  # ---------------------------------------------------------------------------
  # GLOBAL METADATA (Utilisé par layouts/partials/seo.html)
  # ---------------------------------------------------------------------------
  description: "Explorations éclectiques, inoccupations impersonnelles et science du particulier."
  images: ["/media/logo.png"] # Logo principal pour Open Graph
  logo: "/media/logo.png" # Logo du site
  twitter: "GetResearchDev"
  same_as:
    - "https://www.youtube.com/@presque-quelque-chose"
    - "https://www.instagram.com/presque_quelque_chose/"

  # ---------------------------------------------------------------------------
  # IDENTITY / AUTHOR DATA
  # ---------------------------------------------------------------------------
  author:
    name: "Mathieu Allag" # Ajoutez votre nom ici
    birthdate: "2002-01-15"

  # Site header
  header:
    navbar:
      enable: true
      show_search: true
      show_theme_chooser: false

  # Site footer
  footer:
    copyright:
      notice: "© {year} Me. This work is licensed under {license}"
      license:
        enable: true
        allow_derivatives: false
        share_alike: true
        allow_commercial: false

  # Localization
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"

  # Site features
  features:
    math:
      enable: false
    privacy_pack:
      enable: false
    repository:
      url: "https://github.com/HugoBlox/hugo-blox-builder/"
      content_dir: templates/blog/content
      branch: main

  # ---------------------------------------------------------------------------
  # Supabase Configuration (Forum Patafoin)
  # ---------------------------------------------------------------------------
  # SÉCURITÉ : Les clés sont injectées via variables d'environnement
  # - Local  : créer .env.local avec HUGO_PARAMS_SUPABASE_URL et HUGO_PARAMS_SUPABASE_KEY
  # - Netlify: configurer dans Site Settings > Environment Variables
  supabase_url: ""
  supabase_key: ""
