# File: config/_default/hugo.yaml

title: "presque-quelque-chose"
baseURL: "https://www.presque-quelque-chose.com/"
languageCode: "fr-fr"

# ===========================================================================
# SERVICES (ANALYTICS)
# ===========================================================================
services:
  googleAnalytics:
    ID: "G-ZKEH9KTM32" 

# ===========================================================================
# CORE BUILD SETTINGS
# ===========================================================================
build:
  writeStats: true # Indispensable pour Tailwind JIT

# Fusion des paramètres de sécurité et minify
security:
  enableInlineShortcodes: true
minify:
  disableXML: true
  minifyOutput: true

# ===========================================================================
# MODULES & THEME MOUNTS
# ===========================================================================
module:
  mounts:
    - source: assets
      target: assets

    # [CORRECTIF NETLIFY]
    # Suppression du mount hugo_stats.json pour éviter les erreurs de "Cold Build".
    - source: layouts
      target: layouts
    - source: content
      target: content
    - source: static
      target: static

    # Imports Hugo Blox
    - source: hugo-blox/blox/community
      target: layouts/_partials/blox/community/
      includeFiles: "**.html"
    - source: hugo-blox/blox/all-access
      target: layouts/_partials/blox/
      includeFiles: "**.html"
    - source: hugo-blox/blox
      target: assets/dist/community/blox/
      includeFiles: "**.css"

  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-plugin-netlify
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

# ===========================================================================
# OUTPUTS & FORMATS (API STATIC)
# ===========================================================================
outputFormats:
  ALMANACH:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true
  RANDOMIZER:
    mediaType: "application/json"
    baseName: "articles-aleatoires"
    isPlainText: true
    notAlternative: true
  RHIZOME:
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, RANDOMIZER]
  section: [HTML, RSS, ALMANACH]
  page: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

# ===========================================================================
# NAVIGATION & MENUS
# ===========================================================================
menus:
  main:
    - name: solutions imaginaires
      url: /solutions-imaginaires/
      weight: 10
    - name: recherches
      url: /recherches/
      weight: 20
    - name: ondes & pixels
      url: /ondes-pixels/
      weight: 30
    - name: rhizome curieux
      url: /rhizome-curieux/
      weight: 40
    - name: patafoin
      url: /patafoin/
      weight: 50

# ===========================================================================
# PAGE & CONTENT OPTIONS
# ===========================================================================
cascade:
  - _target:
      path: /blog/**
    pager: true
    editable: true
    show_date_updated: true
    reading_time: true
    commentable: true
    show_related: true
    share: true
    show_breadcrumb: false
    header:
      navbar:
        enable: true
  - _target:
      path: /recherches/**
    params:
      full_width: true

  - _target:
      path: /rhizome-curieux/**
    params:
      full_width: true

# --- MARKUP & HOOKS ---
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
    endLevel: 6
    ordered: false
  renderHooks:
    link: {}

# --- GLOBAL SETTINGS ---
defaultContentLanguage: fr
removePathAccents: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
timeout: 600000

taxonomies:
  tag: tags
  category: categories
  author: authors

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70

imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture

# ===========================================================================
# SITE PARAMETERS
# ===========================================================================
params:
  # ---------------------------------------------------------------------------
  # GLOBAL METADATA (Utilisé par layouts/partials/seo.html)
  # ---------------------------------------------------------------------------
  description: "Explorations numériques, design dense et architecture web."
  images: ["og-default.jpg"] # Doit exister dans assets/images/
  twitter: "GetResearchDev"

  # ---------------------------------------------------------------------------
  # IDENTITY / AUTHOR DATA
  # ---------------------------------------------------------------------------
  author:
    name: "Mathieu" # Ajoutez votre nom ici
    birthdate: "2002-01-15"

  # SITE SETUP
  # Appearance
  appearance:
    mode: dark
    color: custom # Dit à Hugo de chercher notre custom.css

  # Site header
  header:
    navbar:
      enable: true
      show_search: true
      show_theme_chooser: false

  # Site footer
  footer:
    copyright:
      notice: "© {year} Me. This work is licensed under {license}"
      license:
        enable: true
        allow_derivatives: false
        share_alike: true
        allow_commercial: false

  # Localization
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"

  # Site features
  features:
    math:
      enable: false
    privacy_pack:
      enable: false
    repository:
      url: "https://github.com/HugoBlox/hugo-blox-builder/"
      content_dir: templates/blog/content
      branch: main

