hal:
  enabled: true
  name: HAL radio studies search
  base_url: "https://api.archives-ouvertes.fr/search/"
  limit: 20
  # La requête effective est générée depuis keyword_categories et keyword_limit.
  query: '("radio libre" OR podcast OR "radios libres" OR podcasting OR "free radio" OR baladodiffusion OR "pirate radio" OR "audio storytelling" OR "community radio" OR "serialized audio")'
  keyword_categories:
    - radio_free
    - podcast
  keyword_limit: 10
  fields:
    - docid
    - title_s
    - abstract_s
    - keyword_s
    - authorFullName_s
    - doiId_s
    - doi_s
    - producedDate_tdate
    - producedDateY_i
    - language_s
    - docType_s
    - uri_s
  filters:
    language:
      - fr
      - en
  sort: "producedDate_tdate desc"

crossref:
  enabled: false
  name: Crossref radio journals
  base_url: "https://api.crossref.org"
  mailto_env: "CROSSREF_MAILTO"
  user_agent: "radio-watch/0.1 (mailto via CROSSREF_MAILTO)"
  rows: 20
  sort: "published"
  order: "desc"
  timeout_seconds: 20
  polite_delay_seconds: 1
  journals:
    - id: journal_radio_audio_media
      name: Journal of Radio & Audio Media
      enabled: true
      issn:
        - "1937-6529"
        - "1937-6537"
      tags:
        - academic_watch
        - radio_studies
        - podcast_studies
