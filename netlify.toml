[build]
  # NOTE ARCHITECTE : J'ai retiré "-b $URL" de la commande ci-dessous.
  # On fait confiance à hugo.yaml pour l'URL de prod.
  command = """
    set -e
    echo "=== Starting Blog build process ==="
    echo "Node version: $(node --version)"
    echo "pnpm version: $(pnpm --version)"
    echo "Hugo version: $(hugo version)"
    
    echo "=== Installing dependencies ==="
    pnpm install --verbose
    
    echo "=== Running Hugo build ==="
    hugo --gc --minify --logLevel debug --printI18nWarnings --printPathWarnings
    
    echo "=== Running Pagefind indexing ==="
    pnpm dlx pagefind --source 'public' --verbose
    
    echo "=== Build completed successfully ==="
  """
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.160.1"
  HUGO_EXTENDED = "true"
  GO_VERSION = "1.21.5"
  NODE_VERSION = "22"
  HUGO_ENABLEGITINFO = "true"
  HUGO_LOG_I18N_WARNINGS = "true"
  HUGO_LOG_WARNINGS = "true"
  FORCE_COLOR = "1"
  PNPM_LOG_LEVEL = "debug"

# ═══════════════════════════════════════════════════════════════════════════
# CONTEXTE DE PRODUCTION (Le Fix est ici)
# ═══════════════════════════════════════════════════════════════════════════
[context.production.environment]
  HUGO_ENV = "production"
  # On force l'URL pour être certain que le Sitemap soit correct
  HUGO_BASEURL = "https://www.presque-quelque-chose.com/"
  URL = "https://www.presque-quelque-chose.com/"

# ═══════════════════════════════════════════════════════════════════════════
# PREVIEWS (On garde le comportement dynamique ici)
# ═══════════════════════════════════════════════════════════════════════════
[context.deploy-preview]
  command = """
    set -e
    echo "=== Deploy Preview Build ==="
    echo "Deploy URL: $DEPLOY_PRIME_URL"
    pnpm install --verbose
    # Ici on garde -b car l'URL est dynamique
    hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL --logLevel debug --printI18nWarnings --printPathWarnings
    pnpm dlx pagefind --source 'public' --verbose
  """

[context.branch-deploy]
  command = """
    set -e
    echo "=== Branch Deploy Build ==="
    echo "Deploy URL: $DEPLOY_PRIME_URL"
    pnpm install --verbose
    # Ici on garde -b car l'URL est dynamique
    hugo --gc --minify -b $DEPLOY_PRIME_URL --logLevel debug --printI18nWarnings --printPathWarnings
    pnpm dlx pagefind --source 'public' --verbose
  """

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true

# ═══════════════════════════════════════════════════════════════════════════
# SECURITY HEADERS
# ═══════════════════════════════════════════════════════════════════════════

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://api.podcache.net; script-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://api.podcache.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://embed.acast.com https://api.podcache.net https://redcircle.com; media-src 'self' https:; upgrade-insecure-requests"

# ═══════════════════════════════════════════════════════════════════════════
# PERFORMANCE HEADERS
# ═══════════════════════════════════════════════════════════════════════════

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ═══════════════════════════════════════════════════════════════════════════
# REDIRECTIONS (SEO)
# ═══════════════════════════════════════════════════════════════════════════

[[redirects]]
  from = "/categories/*"
  to = "/tags/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/categories"
  to = "/tags/"
  status = 301
  force = true
